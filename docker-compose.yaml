services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: etl_db
    ports:
      - "55432:5432"
    secrets:
      - db_password

  etl:
    image: alvin1212/aams-etl:v1.2
    environment:
      POSTGRES_USER: etl_user
      POSTGRES_DB: etl_db
      POSTGRES_IP: postgres
      POSTGRES_PORT: 5432
      POSTGRES_TABLE: salary
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    command: /bin/sh -c "export POSTGRES_PASSWORD=$$(cat /run/secrets/db_password) && python -m consumers.etl_consumer"
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_started

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092, CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT, CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      ALLOW_PLAINTEXT_LISTENER: "yes"

  shadowtraffic:
    image: shadowtraffic/shadowtraffic:latest
    env_file:
      - license.env
    configs:
      - source: shadowtraffic_config
        target: /home/config.json
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    command: [
              "--config", "/home/config.json",
              "--watch",
              "--sample", "20"]

configs:
  shadowtraffic_config:
    file: aams_responses.json

secrets:
  db_password:
    file: db_password.txt